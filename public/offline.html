<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#040506">
  <meta name="color-scheme" content="dark">
  <title>polka — нет соединения</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;padding: max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f2f4f7;background:#040506}
    main{width:100%;max-width:440px;text-align:center;padding:40px 28px;border:1px solid #ffffff1a;border-radius:28px;background:#0d1015;box-shadow:0 20px 80px #00000040}
    img{display:block;width:84px;height:84px;margin:0 auto;border-radius:22px}
    h1{font-size:26px;letter-spacing:-.6px;line-height:1.25;margin:26px 0 14px}
    p{font-size:15px;color:#b2b7c0;line-height:1.7;margin:0 0 24px}
    button{min-height:46px;padding:12px 24px;border:0;border-radius:14px;background:#f2f4f7;color:#111318;font-family:inherit;font-weight:600;font-size:15px;cursor:pointer;transition:background .15s}
    button:hover{background:#dce6f7}
    button:focus-visible{outline:3px solid #77aaff;outline-offset:4px}
    small{display:block;margin-top:20px;font-size:12px;color:#8b939f;line-height:1.7}
    @media(prefers-reduced-motion:reduce){button{transition:none}}
  </style>
</head>
<body>
  <main>
    <img src="/icons/polka-192.png" width="84" height="84" alt="polka">
    <h1>Вы сейчас без интернета</h1>
    <p>Учебные материалы и чат доступны при подключении к сети. Когда связь восстановится, вернитесь в библиотеку.</p>
    <button type="button" onclick="location.reload()">Попробовать снова</button>
    <small>На этой странице нет личных материалов.<br>Ваша библиотека остаётся в аккаунте polka.</small>
  </main>
</body>
</html>
